name: Build firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Siapkan file .bin
        run: |
          set -e
          B=.pio/build/ttgo-gif
          mkdir -p out
          cp $B/firmware.bin   out/ttgo-gif-app.bin
          cp $B/bootloader.bin out/bootloader.bin
          cp $B/partitions.bin out/partitions.bin
          # satu file siap flash dari alamat 0x0
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            -o out/ttgo-gif-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0x10000 $B/firmware.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ttgo-gif-player
          path: out/
