; Firmware GIF player untuk LilyGo T-Display (TTGO, ESP32 biasa, ST7789 135x240)

[env:ttgo-gif]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; flash 4 MB: aplikasi ~1.9 MB + LittleFS ~2 MB untuk menyimpan GIF
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/AnimatedGIF@^2.1.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; --- pengaturan TFT_eSPI untuk T-Display (tanpa edit User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
